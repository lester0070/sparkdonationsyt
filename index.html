<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Donate via UPI</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0084ff;
      color: white;
      text-align: center;
      padding: 40px;
    }

    img.logo {
      max-width: 120px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      color: #ffe100;
      margin-bottom: 10px;
    }

    form {
      background: rgba(255, 255, 255, 0.1);
      display: inline-block;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      margin-bottom: 20px;
    }

    input, textarea {
      width: 90%;
      max-width: 300px;
      margin: 10px 0;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: white;
      color: #00295c;
      font-size: 14px;
    }

    textarea {
      resize: none;
    }

    button {
      background: #ffe100;
      color: #00295c;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #ffd700;
    }

    img.qr {
      max-width: 200px;
      margin: 20px auto;
      border: 4px solid #ffe100;
      border-radius: 12px;
    }

    p strong {
      color: #ffe100;
    }
  </style>
</head>
<body>

  <!-- Logo Placeholder -->
  <img src="spark logo.png" alt="Channel Logo" class="logo">

  <h1>Support the Stream</h1>
  <p>Donate using any UPI app (Google Pay, PhonePe, etc.)</p>

  <form id="donationForm">
    <input type="text" name="name" placeholder="Your Name"><br>
    <input type="number" name="amount" placeholder="Amount (₹)" required><br>
    <textarea name="message" placeholder="Your Message (optional)" rows="3"></textarea><br>
    <button type="submit">Donate</button>
  </form>

  <p><strong>Or scan to pay:</strong></p>
  <img class="qr" src="Qrcode.jpeg" alt="Scan to Pay UPI">

  <script>
    document.getElementById('donationForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const upiID = "lesterpereira88@oksbi";
      const name = encodeURIComponent(this.name.value.trim() || "Donor");
      const amount = encodeURIComponent(this.amount.value.trim());
      const message = encodeURIComponent(this.message.value.trim());

      const upiLink = `upi://pay?pa=${upiID}&pn=${name}&am=${amount}&cu=INR&tn=${message}`;
      
      // Redirect to the Thank You page
      window.location.href = "thank-you.html";

      // Open UPI link for payment
      window.location.href = upiLink;
    });
  </script>

</body>
</html>
